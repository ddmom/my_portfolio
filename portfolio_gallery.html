<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>조민영 VR 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16130f;--muted:#6b645b;--glass:rgba(252,250,247,.74);--accent:#b8743a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e4e1dc;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer;color:inherit}
.hud{position:fixed;z-index:5;pointer-events:none}.hud>*{pointer-events:auto}

#top{top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;opacity:0;transition:opacity 1.2s}
#brand .eyebrow{font-size:11px;letter-spacing:.32em;color:#8a5a2e;font-weight:600}
#brand h1{margin:4px 0 0;font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;text-shadow:0 1px 12px rgba(255,255,255,.8)}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(60,40,20,.12);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.pill.on{background:#2a211a;color:#fff;border-color:#2a211a}

#card{right:22px;top:50%;width:340px;transform:translate(30px,-50%);opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;
  background:rgba(252,250,247,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(50,35,20,.22)}
#card.show{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#card .no{font-size:12px;letter-spacing:.25em;color:#8a5a2e;font-weight:600}
#card h2{margin:6px 0 4px;font-family:'Gowun Batang',serif;font-size:27px;line-height:1.3}
#card .sub{font-size:14px;color:#3b342c;margin-bottom:12px}
#card .meta{font-size:11px;color:var(--muted);border-top:1px solid rgba(90,70,50,.18);border-bottom:1px solid rgba(90,70,50,.18);padding:8px 0;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
#card p{font-size:13px;line-height:1.75;color:#3b342c;margin:0 0 10px}
#card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
#card .tags span{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(184,116,58,.12);color:#7a4a20}
#card .go{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:12px;border:0;background:#2a211a;color:#fff;font-weight:600;font-size:14px;text-decoration:none}
#card .go:hover{background:#45372b}
#card .go2{margin-top:8px;background:transparent;color:#2a211a;border:1px solid rgba(42,33,26,.3)}
#card .go2:hover{background:rgba(42,33,26,.06)}
#card .nav{display:flex;gap:8px;margin-top:10px}
#card .nav button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(90,70,50,.25);background:rgba(255,255,255,.6);font-size:12px}
#progress{height:2px;background:rgba(90,70,50,.15);border-radius:2px;margin-top:14px;overflow:hidden}
#progress i{display:block;height:100%;width:0;background:var(--accent)}

#strip{left:0;right:0;bottom:0;padding:0 16px 16px;opacity:0;transition:opacity 1.2s}
#strip .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;justify-content:safe center}
#strip .row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);font-size:12px;color:#3b342c;transition:background .3s,color .3s}
.chip img{width:26px;height:26px;object-fit:cover;border-radius:7px;background:#ccc}
.chip:hover{border-color:var(--accent)}
.chip.active{background:#2a211a;color:#fff;border-color:#2a211a}

#hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:11px;color:#4d453c;background:rgba(255,255,255,.6);padding:5px 12px;border-radius:999px;opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap}

#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,253,249,.6),rgba(228,223,215,.86) 60%,rgba(205,198,188,.96));transition:opacity 1.6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .eyebrow{font-size:12px;letter-spacing:.5em;color:#8a5a2e;font-weight:600}
#intro h1{font-family:'Gowun Batang',serif;font-size:clamp(34px,6vw,62px);margin:14px 0 8px}
#intro .sub{font-size:14px;color:#4d453c;margin-bottom:34px;line-height:1.8}
#enter{padding:15px 46px;border-radius:999px;border:1px solid #2a211a;background:#2a211a;color:#fff;font-size:15px;letter-spacing:.2em;box-shadow:0 10px 30px rgba(42,33,26,.3)}
#enter:disabled{opacity:.55;cursor:wait}
#enter:not(:disabled):hover{background:#45372b}
#err{margin-top:18px;font-size:12px;color:#a33;max-width:520px;line-height:1.6}

#fade{position:fixed;inset:0;z-index:30;background:#f4f6f9;opacity:0;pointer-events:none;transition:opacity 1s ease-out}
#fade.on{opacity:1;pointer-events:auto}
#fadeMsg{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:'Gowun Batang',serif;font-size:16px;letter-spacing:.1em;color:#6b645b}
#tip{position:fixed;z-index:6;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(42,33,26,.88);color:#fff;font-size:12px;opacity:0;transition:opacity .2s;transform:translate(12px,12px)}

/* 크게 보기 */
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(20,16,12,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px 16px}
#lightbox.show{display:flex}
.lb-body{display:flex;gap:28px;align-items:center;width:min(1280px,100%);max-height:100%;min-height:0}
.lb-view{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;max-height:100%}
#lbImg{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;box-shadow:0 20px 70px rgba(0,0,0,.5);background:#fff;border-radius:6px}
.lb-info{width:340px;flex-shrink:0;color:#f3e8dc;word-break:keep-all}
.lb-info .no{font-size:12px;letter-spacing:.25em;color:#e9c9a6;font-weight:600}
.lb-info h2{font-family:'Gowun Batang',serif;font-size:28px;margin:6px 0 10px;color:#fff}
.lb-lead{font-size:16px;font-weight:600;line-height:1.6;margin:0 0 16px}
.lb-points{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.lb-points li{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.4}
.lb-points b{width:26px;height:26px;border-radius:50%;background:#b8743a;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lb-info .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}.lb-info .tags span{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(233,201,166,.18);color:#e9c9a6}
.lb-desc{font-size:13px;line-height:1.7;color:#cfc3b6;margin:0}
.lb-dl{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:11px 18px;border-radius:12px;border:1px solid #e9c9a6;background:transparent;color:#f3e8dc;font-weight:600;font-size:14px}.lb-dl:hover{background:rgba(233,201,166,.15)}
@media (max-width:860px){#lightbox{justify-content:flex-start;overflow:auto}.lb-body{flex-direction:column;align-items:stretch}.lb-info{width:auto}#lbImg{max-height:50vh}}
#lbThumbs{display:flex;gap:8px;margin-top:14px}
#lbThumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;opacity:.5;cursor:pointer;border:2px solid transparent}
#lbThumbs img.on{opacity:1;border-color:#e9c9a6}
#lbClose{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px}


@media (max-width:760px){
  #top{padding:14px}#brand h1{font-size:19px}#controls .pill{padding:7px 10px;font-size:11px}
  #card{left:12px;right:12px;width:auto;top:auto;bottom:70px;transform:translateY(30px);padding:16px;max-height:50vh;overflow:auto}
  #card.show{transform:translateY(0)}
  #card h2{font-size:21px}#card p{font-size:12px}
  #strip .row{justify-content:flex-start}
  #hint{display:none}
}
</style>
</head>

function makeBeam(rTop, rBot, k){
  const m = new THREE.ShaderMaterial({
    uniforms:{ ...beamUniforms, uK:{ value:k } }, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vV; uniform float uTime; uniform float uK; uniform float uStrength;
      void main(){
        float facing = pow(abs(dot(vN,vV)), 2.2);
        float streak = 0.65 + 0.35*sin(vUv.x*70.0 + sin(vUv.x*13.0)*3.0 + uTime*0.25);
        float vertical = smoothstep(0.0, 0.55, vUv.y) * (0.55 + 0.45*vUv.y);
        float a = facing * streak * vertical * uK * uStrength;
        gl_FragColor = vec4(vec3(1.0,0.96,0.9)*a, a);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, CEIL_Y, 64, 1, true), m);
  mesh.position.y = CEIL_Y/2; mesh.renderOrder = 5; scene.add(mesh);
}

  spots.forEach(s=>s.goal=0);
  $('card').classList.remove('show');
  [...chipsEl.children].forEach(c=>c.classList.remove('active'));
}

function computeWanted(dt){
  const t = state.time, narrow = innerWidth <= 760, wide = innerWidth > 1000;
  if(state.mode==='intro'){
    want.a = Math.PI*0.9 + t*0.03; want.r = 6.5; want.h = 15; want.target.set(0,0,0);
  } else if(state.mode==='overview'){
    // 빛기둥 옆에서 맞은편 벽을 바라보며 천천히 한 바퀴
    overviewA += dt*0.05;
    want.a = overviewA; want.r = 1.2; want.h = 2.2;
    want.target.copy(radial(overviewA+Math.PI, WALL_R, 1.75));
  } else {
    const a = angleOf(state.index);
    const sway = -0.1*Math.cos(state.shotT*Math.PI/DWELL);   // 작품 앞을 왼쪽→오른쪽으로 천천히 지나감
    want.a = a + sway; want.r = WALL_R - 5.9; want.h = 1.62 + 0.08*Math.sin(state.shotT*0.4);
    want.target.copy(radial(a, WALL_R, HANG_Y));
    if(wide) want.target.addScaledVector(rightOf(a), 1.15);  // 오른쪽 카드에 가리지 않도록 작품을 왼쪽에
    if(narrow){ want.a = a + sway*0.3; want.r = 0.4; want.h = 1.5; want.target.y -= 1.7; }  // 모바일: 세로 화면에 액자가 다 들어오도록 물러서고, 하단 카드 위로 작품을 올림
  }
}
function updateCamera(dt){
  computeWanted(dt);
  const k = state.mode==='focus' ? 0.9 : (state.mode==='overview' ? 0.6 : 2);
  cam.a += angDiff(cam.a, want.a) * (1-Math.exp(-k*dt));
  cam.r = damp(cam.r, want.r, k, dt);
  cam.h = damp(cam.h, want.h, k*0.85, dt);
  camTarget.x = damp(camTarget.x, want.target.x, k*1.3, dt);
  camTarget.y = damp(camTarget.y, want.target.y, k*1.3, dt);
  camTarget.z = damp(camTarget.z, want.target.z, k*1.3, dt);
  mouseSmooth.x = damp(mouseSmooth.x, mouse.x, 2, dt); mouseSmooth.y = damp(mouseSmooth.y, mouse.y, 2, dt);
  camera.position.set(Math.cos(cam.a)*cam.r, cam.h, Math.sin(cam.a)*cam.r);
  const look = camTarget.clone();
  const right = new THREE.Vector3().subVectors(look, camera.position).cross(camera.up).normalize();
  look.addScaledVector(right, mouseSmooth.x*0.3).add(new THREE.Vector3(0, mouseSmooth.y*0.2, 0));
  camera.lookAt(look);
}

function updateLighting(dt){
  const focus = state.mode==='focus';
  hemi.intensity = damp(hemi.intensity, focus ? 0.42 : 0.75, 1.2, dt);
  sun.intensity = damp(sun.intensity, focus ? 0.5 : 1.0, 1.2, dt);
  spots.forEach(s=>{ s.level = damp(s.level, s.goal, s.goal ? 1.1 : 1.6, dt); s.light.intensity = s.level*11; s.light.visible = s.level>0.01; });
  beamUniforms.uStrength.value = damp(beamUniforms.uStrength.value, focus ? 0.7 : 1.0, 1, dt);
  pieces.forEach((pc,i)=>{
    if(!pc) return;
    const goal = state.mode==='intro' ? 0.4 : (state.mode==='overview' ? 0.65 : (i===state.index ? 1 : 0.25));
    pc.lit = damp(pc.lit, Math.max(goal, pc.hover ? 0.85 : 0), 2, dt);
    pc.artMat.emissiveIntensity = 0.06 + pc.lit*0.14;
    pc.bulbMat.opacity = 0.15 + pc.lit*0.85;
    pc.wash.material.opacity = pc.lit*0.1;
  });
}

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let hoverIdx = -1;
function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.index : -1;
}
renderer.domElement.addEventListener('pointermove', ev=>{
  mouse.set((ev.clientX/innerWidth)*2-1, -(ev.clientY/innerHeight)*2+1);
  if(state.mode==='intro') return;
  const i = pick(ev);
  if(i!==hoverIdx){ if(hoverIdx>=0) pieces[hoverIdx].hover=0; hoverIdx=i; if(i>=0) pieces[i].hover=1; }
  renderer.domElement.style.cursor = i>=0 ? 'pointer' : 'default';
  const tip=$('tip');
  if(i>=0){ tip.textContent = i===state.index ? '클릭해서 상세 보기' : `${pad(i)} · ${WORKS[i].title}`; tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.style.opacity=1; }
  else tip.style.opacity=0;
});
renderer.domElement.addEventListener('click', ev=>{
  if(state.mode==='intro') return;
  const i = pick(ev);
  if(i<0) return;
  if(i===state.index) openLightbox(i);   // 이미 비추고 있는 작품은 한 번 더 클릭하면 크게 보기
  else focusOn(i, true);
});

$('btnOverview').onclick = ()=>overview();
$('btnTour').onclick = ()=>{ state.tour = !state.tour; setTourButton(); if(state.tour && state.mode!=='focus') focusOn(0); };
$('cPrev').onclick = ()=>focusOn(state.index-1, true);
$('cNext').onclick = ()=>focusOn(state.index+1, true);
addEventListener('keydown', e=>{
  if(state.mode==='intro') return;
  if(lbIndex>=0){ if(e.key==='Escape') closeLightbox(); return; }
  if(e.key==='ArrowRight') focusOn((state.index<0?-1:state.index)+1, true);
  else if(e.key==='ArrowLeft') focusOn((state.index<0?1:state.index)-1, true);
  else if(e.key==='Escape') overview();
  else if(e.key===' '){ e.preventDefault(); $('btnTour').click(); }
});

function enter(){
  $('intro').classList.add('hide');
  ['top','strip','hint'].forEach(id=>$(id).style.opacity=1);
  setTimeout(()=>{ $('hint').style.opacity=0; }, 9000);
  overview();
  setTimeout(()=>{ if(state.tour && state.mode==='overview') focusOn(0); }, 8000);
}
$('enter').onclick = enter;

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;
  if(state.mode==='focus' && lbIndex<0){
    state.shotT += dt;
    $('progBar').style.width = (state.tour ? Math.min(100, state.shotT/DWELL*100) : 0)+'%';
    if(state.tour && state.shotT >= DWELL){
      if(state.index === N-1){ overview(); setTimeout(()=>{ if(state.tour && state.mode==='overview') focusOn(0); }, 12000); }
      else focusOn(state.index+1);
    }
  }
  beamUniforms.uTime.value = state.time;
  const pa = dustGeo.attributes.position;
  for(let i=0;i<DUST;i++){
    let y = pa.getY(i) - dt*(0.08+dustSeed[i]*0.12); if(y<0) y += CEIL_Y;
    pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(state.time*0.4 + dustSeed[i]*30)*dt*0.03);
  }
  pa.needsUpdate = true;
  updateCamera(dt);
  updateLighting(dt);
  composer.render();
  requestAnimationFrame(tick);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- load
const loader = new THREE.TextureLoader();
let loaded = 0, failed = 0;
const btn = $('enter');
const q = new URLSearchParams(location.search);
const fromHall = q.get('from')==='hall';
const workIdx = WORKS.findIndex(w=>w.id===q.get('work'));
const seat = parseInt(q.get('seat'), 10);
{
  // 졸업전시장에서 넘겨준 주소가 있으면 그곳으로, 없으면 같은 폴더의 vr_gallery.html로 돌아감
  let hall = 'vr_gallery.html';
  try { const h = new URL(q.get('hall') || '', location.href); if(q.get('hall') && h.origin === location.origin) hall = h.href; } catch(e){}
  $('btnHall').href = hall + '?return=' + (seat >= 1 ? seat : 1);
}
tick();

// 이미지가 하나씩 도착하는 대로 바로 벽에 겁니다 (전체를 기다리지 않음)
const loads = WORKS.map((w,i)=>new Promise(res=>{
  loader.load(w.wall, tex=>{ buildArtwork(i, tex); loaded++; if(btn.disabled) btn.textContent = `불러오는 중… ${loaded}/${N}`; res(); },
    undefined, ()=>{ failed++; buildArtwork(i, placeholderTexture(i)); res(); });
}));
// 글꼴은 기다리지 않고, 준비되면 캡션만 다시 그림
if(document.fonts) document.fonts.ready.then(()=>pieces.forEach((pc,i)=>{ if(pc){ pc.cap.material.map.dispose(); pc.cap.material.map = captionTexture(i); } }));

if(fromHall){
  // 졸업전시장 토르소를 통해 들어온 경우: 기다리지 않고 바로 1층에서 시작하며 빛이 걷힘
  $('intro').style.transition = 'none'; enter();
  computeWanted(0); cam.a = want.a; cam.r = want.r; cam.h = want.h; camTarget.copy(want.target);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('fade').classList.remove('on')));
}
if(workIdx >= 0){
  // 홈의 작품 바로가기로 들어온 경우: 입장 화면 없이 그 작품 앞에서 바로 시작
  if(!fromHall){ $('intro').style.transition = 'none'; enter(); }
  focusOn(workIdx, true);
  computeWanted(0); cam.a = want.a; cam.r = want.r; cam.h = want.h; camTarget.copy(want.target);
}
Promise.all(loads).then(()=>{
  btn.disabled = false; btn.textContent = '입장하기';
  if(failed && location.protocol==='file:')
    $('err').textContent = '파일을 더블클릭해서 열면 브라우저 보안 때문에 작품 이미지가 보이지 않습니다. GitHub Pages에 올리거나, 폴더에서 python -m http.server 실행 후 http://localhost:8000/portfolio_gallery.html 로 열어 주세요.';
  if(!fromHall && q.has('autostart')) enter();
  window.__vr = { state, pieces, camera, scene, focusOn, overview, enter, snap(){ computeWanted(0); cam.a=want.a; cam.r=want.r; cam.h=want.h; camTarget.copy(want.target); pieces.forEach(p=>p&&(p.lit=0.6)); spots.forEach(s=>s.level=s.goal); } };
});
</script>
