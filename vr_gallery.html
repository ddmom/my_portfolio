<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VR 토르소 미술관 · 졸업전시</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1622;--muted:#5d6b7c;--glass:rgba(248,251,255,.72);--line:rgba(120,170,230,.45);--accent:#4aa3ff;--accent2:#9fd4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe4ea;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;cursor:pointer}
.hud{position:fixed;z-index:5;pointer-events:none}.hud>*{pointer-events:auto}

/* 상단 */
#top{top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;opacity:0;transition:opacity 1.2s}
#brand .eyebrow{font-size:11px;letter-spacing:.32em;color:#2f5f93;font-weight:600}
#brand h1{margin:4px 0 0;font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 12px rgba(255,255,255,.8)}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 18px rgba(30,60,100,.12);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600}
.pill:hover{border-color:var(--accent)}
.pill.on{background:#123a63;color:#fff;border-color:#123a63}

/* 작가 카드 */
#card{right:22px;top:50%;width:340px;transform:translate(30px,-50%);opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;
  background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(226,240,255,.74));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(20,50,90,.22)}
#card.show{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#card .no{font-size:12px;letter-spacing:.25em;color:#2f6db0;font-weight:600}
#card h2{margin:6px 0 2px;font-family:'Gowun Batang',serif;font-size:28px}
#card .work{font-size:15px;color:#24364b;margin-bottom:12px}
#card .meta{font-size:11px;color:var(--muted);border-top:1px solid rgba(80,120,170,.2);border-bottom:1px solid rgba(80,120,170,.2);padding:8px 0;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
#card p{font-size:13px;line-height:1.75;color:#2a3a4d;margin:0 0 16px}
#card .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:0;background:linear-gradient(90deg,#123a63,#2a78c8);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
#card .go:hover{filter:brightness(1.12)}
#card .go.disabled{background:#9fb0c3;pointer-events:none}
#card .nav{display:flex;gap:8px;margin-top:10px}
#card .nav button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(80,120,170,.3);background:rgba(255,255,255,.6);font-size:12px}
#progress{height:2px;background:rgba(80,120,170,.18);border-radius:2px;margin-top:14px;overflow:hidden}
#progress i{display:block;height:100%;width:0;background:var(--accent)}

/* 하단 작가 목록 */
#strip{left:0;right:0;bottom:0;padding:0 16px 16px;opacity:0;transition:opacity 1.2s}
#strip .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;justify-content:safe center}
#strip .row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.85);font-size:12px;color:#24364b;transition:all .3s}
.chip b{font-size:10px;color:#2f6db0;letter-spacing:.08em}
.chip:hover{border-color:var(--accent)}
.chip.active{background:#123a63;color:#fff;border-color:#123a63}.chip.active b{color:#9fd4ff}

#hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);font-size:11px;color:#40546b;background:rgba(255,255,255,.55);padding:5px 12px;border-radius:999px;opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap}

/* 입장 화면 */
#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.55),rgba(214,224,236,.82) 60%,rgba(190,204,222,.95));transition:opacity 1.6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .eyebrow{font-size:12px;letter-spacing:.5em;color:#2f5f93;font-weight:600}
#intro h1{font-family:'Gowun Batang',serif;font-size:clamp(34px,6vw,64px);margin:14px 0 8px;letter-spacing:.04em}
#intro .sub{font-size:14px;color:#3d5068;margin-bottom:34px;line-height:1.8}
#enter{padding:15px 46px;border-radius:999px;border:1px solid #123a63;background:#123a63;color:#fff;font-size:15px;letter-spacing:.2em;box-shadow:0 10px 30px rgba(18,58,99,.35)}
#enter:disabled{opacity:.5;cursor:wait}
#enter:not(:disabled):hover{background:#1d5590}
#err{margin-top:18px;font-size:12px;color:#a33}

#fade{position:fixed;inset:0;z-index:30;background:#f4f6f9;opacity:0;pointer-events:none;transition:opacity 1.1s ease-in}
#fade.on{opacity:1;pointer-events:auto}
#tip{position:fixed;z-index:6;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(18,58,99,.88);color:#fff;font-size:12px;opacity:0;transition:opacity .2s;transform:translate(12px,12px)}

@media (max-width:760px){
  #top{padding:14px}#brand h1{font-size:19px}#controls .pill{padding:7px 10px;font-size:11px}
  #card{left:12px;right:12px;width:auto;top:auto;bottom:66px;transform:translateY(30px);padding:16px;max-height:52vh;overflow:auto}
  #card.show{transform:translateY(0)}
  #card h2{font-size:22px}#card p{font-size:12px;margin-bottom:12px}
  #strip .row{justify-content:flex-start}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="intro">
  <div class="eyebrow">GRADUATION EXHIBITION 2026</div>
  <h1>TORSO · 열다섯 개의 몸</h1>
  <div class="sub">빛이 내려오는 원형 미술관에 열다섯 명의 작가가 각자의 토르소를 세웠습니다.<br>입장하면 카메라가 천천히 작품을 하나씩 비춥니다.</div>
  <button id="enter" disabled>불러오는 중…</button>
  <div id="err"></div>
</div>

<div id="top" class="hud">
  <div id="brand"><div class="eyebrow">VR MUSEUM · GRADUATION 2026</div><h1>TORSO · 열다섯 개의 몸</h1></div>
  <div id="controls">
    <button class="pill" id="btnOverview">전체 보기</button>
    <button class="pill on" id="btnTour">자동 투어 ❚❚</button>
  </div>
</div>

<div id="card" class="hud">
  <div class="no" id="cNo">No. 01</div>
  <h2 id="cName">작가명</h2>
  <div class="work" id="cWork">작품명</div>
  <div class="meta"><span id="cMat">재료</span><span id="cMajor">전공</span></div>
  <p id="cDesc">작가 설명</p>
  <a class="go" id="cGo" href="#">작품 보러가기 →</a>
  <div class="nav"><button id="cPrev">← 이전 작품</button><button id="cNext">다음 작품 →</button></div>
  <div id="progress"><i id="progBar"></i></div>
</div>

<div id="strip" class="hud"><div class="row" id="chips"></div></div>
<div id="hint">토르소를 클릭하면 작가 소개가 열립니다 · ← → 이동 · Space 투어 · Esc 전체 보기</div>
<div id="tip"></div>
<div id="fade"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script>
<script>
window.addEventListener('error',e=>{const el=document.getElementById('err');if(el)el.textContent='오류: '+(e.message||'알 수 없는 오류')+' · 새로고침 후 다시 시도하세요.';});
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
//  출품 작가 15명 데이터 — 여기만 고치면 사이트 전체에 반영됩니다.

//  look: 토르소 재질 (marble, chrome, crystal, rose, navy, copper, gunmetal,
//        frost, cobalt, rosegold, holo, gold, ice, lined, glow)
// =====================================================================
const STUDENTS = [
  { name:'조민영', work:'경험과 내일을 잇는 디자인', major:'UI/UX · 브랜드', material:'백색 대리석', look:'marble', url:'portfolio_gallery.html', desc:'좋은 디자인은 일상을 조금 더 편안하고 행복하게 만든다고 믿습니다. 스타벅스 리디자인, Re:Link, 노래한장, 닥터프릿지, 여행 포스터 콜라주, 묘한친구 — 여섯 점의 작업이 이 토르소 너머 전시실에 걸려 있습니다.' },
  { name:'학생 02', work:'반사된 나',       major:'미디어아트', material:'크롬 도금',     look:'chrome',   url:'', desc:'보는 사람이 작품 표면에 비치면서 비로소 완성되는 몸입니다.' },
  { name:'학생 03', work:'결정의 시간',     major:'공예',       material:'보랏빛 크리스털', look:'crystal', url:'', desc:'오랜 시간 천천히 자라는 결정처럼 쌓여 온 감정을 형상화했습니다.' },
  { name:'학생 04', work:'온도',           major:'산업디자인', material:'반투명 레진',   look:'rose',     url:'', desc:'사람의 체온을 색으로 옮겨, 빛이 통과할 때 따뜻하게 물드는 몸을 만들었습니다.' },
  { name:'학생 05', work:'심해',           major:'조소',       material:'메탈릭 네이비', look:'navy',     url:'', desc:'깊은 바다의 압력을 견디는 단단한 껍질로서의 몸을 표현했습니다.' },
  { name:'학생 06', work:'산화',           major:'금속공예',   material:'구리',         look:'copper',   url:'', desc:'시간이 지나며 변해 가는 구리처럼, 나이 들어가는 몸의 아름다움을 담았습니다.' },
  { name:'학생 07', work:'기계의 심장',     major:'제품디자인', material:'건메탈',       look:'gunmetal', url:'', desc:'인간과 기계의 경계에 선 몸, 그 안에서 뛰는 심장을 상상했습니다.' },
  { name:'학생 08', work:'안개',           major:'시각디자인', material:'젖빛 유리',     look:'frost',    url:'', desc:'흐릿하게만 보이는 타인의 마음을 젖빛 유리 속 몸으로 표현했습니다.' },
  { name:'학생 09', work:'푸른 밤',         major:'회화',       material:'코발트 도자',   look:'cobalt',   url:'', desc:'잠들지 못한 밤의 색을 유약으로 겹겹이 올렸습니다.' },
  { name:'학생 10', work:'장신구',         major:'주얼리디자인', material:'로즈골드',     look:'rosegold', url:'', desc:'몸 자체를 하나의 장신구로 바라본 작업입니다.' },
  { name:'학생 11', work:'데이터 바디',     major:'인터랙션디자인', material:'홀로그램',  look:'holo',     url:'', desc:'우리가 남기는 데이터로만 그려진, 실체 없는 몸입니다.' },
  { name:'학생 12', work:'황금비',         major:'조소',       material:'금박',         look:'gold',     url:'', desc:'고전 조각의 비례를 현대의 재료로 다시 읽었습니다.' },
  { name:'학생 13', work:'얼음 왕자',       major:'영상디자인', material:'아이스 글라스', look:'ice',      url:'', desc:'녹아내리기 직전의 순간을 붙잡아 둔 차가운 몸입니다.' },
  { name:'학생 14', work:'선으로 된 몸',     major:'텍스타일',   material:'라인 드로잉',   look:'lined',    url:'', desc:'몸을 감싸는 수많은 선으로 근육과 움직임의 방향을 그렸습니다.' },
  { name:'학생 15', work:'빛의 몸',         major:'공간디자인', material:'발광 레진',     look:'glow',     url:'', desc:'스스로 빛을 내는 몸, 미술관의 빛을 마지막으로 받아내는 작품입니다.' },
];
const DWELL = 9;          // 작품 하나를 비추는 시간(초)
const RING_R = 7;         // 토르소가 놓인 원의 반지름(m)
const PED_H = 1.0;        // 좌대 높이
const TORSO_S = 0.88;     // 토르소 크기

// ---------------------------------------------------------------- renderer
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9dee4);
scene.fog = new THREE.Fog(0xd9dee4, 26, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 120);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.4, 1.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xf4f8ff, 0x8d96a1, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xeef5ff, 1.1);   // 천창에서 내려오는 빛
sun.position.set(1.5, 20, 1);
scene.add(sun);

// 카메라가 비추는 작품을 따라가는 두 개의 핀 조명 (번갈아 크로스페이드)
function makeSpot(){
  const s = new THREE.SpotLight(0xfff6ea, 0, 16, 0.32, 0.55, 1.2);
  s.castShadow = true;
  s.shadow.mapSize.set(1024,1024);
  s.shadow.bias = -0.0004;
  s.shadow.camera.near = 2; s.shadow.camera.far = 16;
  scene.add(s, s.target);
  return { light:s, level:0, goal:0, index:-1 };
}
const spots = [makeSpot(), makeSpot()];
let spotTurn = 0;

// ---------------------------------------------------------------- helpers
const lerp = THREE.MathUtils.lerp;
const damp = (a,b,k,dt)=> a + (b-a)*(1-Math.exp(-k*dt));
const angDiff = (a,b)=>{ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; };
const gauss = (x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
const angleOf = i => i/STUDENTS.length*Math.PI*2 + Math.PI/2;
const posOf = (i, y=0)=> new THREE.Vector3(Math.cos(angleOf(i))*RING_R, y, Math.sin(angleOf(i))*RING_R);

// ---------------------------------------------------------------- architecture
const WALL_R = 15, VOID_R = 11.2;
const white = new THREE.MeshStandardMaterial({ color:0xeef0f2, roughness:0.85, metalness:0 });
const concrete = new THREE.MeshStandardMaterial({ color:0xc9ccd0, roughness:0.95 });
const led = new THREE.MeshBasicMaterial({ color:0xdff0ff, toneMapped:false });
const ledCool = new THREE.MeshBasicMaterial({ color:new THREE.Color(1.6,1.9,2.4), toneMapped:false });

// 바닥: 광택 콘크리트
const floor = new THREE.Mesh(new THREE.CircleGeometry(WALL_R, 96),
  new THREE.MeshStandardMaterial({ color:0xb9bec4, roughness:0.22, metalness:0.15, envMapIntensity:0.9 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
// 중앙 원형 라인
const centerRing = new THREE.Mesh(new THREE.RingGeometry(2.6, 2.63, 128), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.75 }));
centerRing.rotation.x = -Math.PI/2; centerRing.position.y = 0.005; scene.add(centerRing);

// 1층 둘레 경사로 난간 (바닥보다 살짝 높은 링)
{
  const g = new THREE.CylinderGeometry(VOID_R+0.4, VOID_R+0.4, 1.05, 128, 1, true);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color:0xf3f4f6, roughness:0.7, side:THREE.DoubleSide }));
  m.position.y = 0.52; m.receiveShadow = true; scene.add(m);
  const strip = new THREE.Mesh(new THREE.TorusGeometry(VOID_R+0.37, 0.025, 6, 160), led);
  strip.rotation.x = Math.PI/2; strip.position.y = 0.12; scene.add(strip);
  const rail = new THREE.Mesh(new THREE.TorusGeometry(VOID_R+0.4, 0.03, 8, 160), new THREE.MeshStandardMaterial({ color:0xb8bec6, metalness:0.9, roughness:0.25 }));
  rail.rotation.x = Math.PI/2; rail.position.y = 1.1; scene.add(rail);
}
// 외벽
const wall = new THREE.Mesh(new THREE.CylinderGeometry(WALL_R, WALL_R, 22, 96, 1, true),
  new THREE.MeshStandardMaterial({ color:0xd5d8dc, roughness:0.95, side:THREE.BackSide }));
wall.position.y = 11; scene.add(wall);

// 위층 원형 발코니 (구겐하임형 링)
const LEVELS = [5.2, 9.4, 13.6];
LEVELS.forEach((y, li)=>{
  const inner = VOID_R - li*0.45; // 위로 갈수록 살짝 안쪽으로
  const slab = new THREE.Mesh(new THREE.RingGeometry(inner, WALL_R, 128, 1), white);
  slab.rotation.x = -Math.PI/2; slab.position.y = y; scene.add(slab);
  const under = new THREE.Mesh(new THREE.RingGeometry(inner, WALL_R, 128, 1), concrete);
  under.rotation.x = Math.PI/2; under.position.y = y-0.55; scene.add(under);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(inner, inner, 1.75, 128, 1, true), new THREE.MeshStandardMaterial({ color:0xf4f5f7, roughness:0.6, side:THREE.DoubleSide }));
  face.position.y = y + 0.32; scene.add(face);
  // 발코니 하부의 띠 조명
  const s1 = new THREE.Mesh(new THREE.TorusGeometry(inner-0.02, 0.028, 6, 192), ledCool);
  s1.rotation.x = Math.PI/2; s1.position.y = y - 0.52; scene.add(s1);
  const s2 = new THREE.Mesh(new THREE.TorusGeometry(inner+0.02, 0.02, 6, 192), led);
  s2.rotation.x = Math.PI/2; s2.position.y = y + 1.18; scene.add(s2);
  // 안쪽 벽의 간접 조명
  const cove = new THREE.Mesh(new THREE.TorusGeometry(WALL_R-0.05, 0.03, 6, 192), led);

const beamUniforms = { uTime:{ value:0 }, uStrength:{ value:1 } };
function makeBeam(rTop, rBot, strength){
  const g = new THREE.CylinderGeometry(rTop, rBot, CEIL_Y, 64, 1, true);
  const m = new THREE.ShaderMaterial({
    uniforms:{ ...beamUniforms, uK:{ value:strength } },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.FrontSide,
    vertexShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vV; uniform float uTime; uniform float uK; uniform float uStrength;
      void main(){
        float facing = pow(abs(dot(vN,vV)), 2.2);
        float streak = 0.65 + 0.35*sin(vUv.x*70.0 + sin(vUv.x*13.0)*3.0 + uTime*0.25);
        float vertical = smoothstep(0.0, 0.55, vUv.y) * (0.55 + 0.45*vUv.y);
        float a = facing * streak * vertical * uK * uStrength;
        gl_FragColor = vec4(vec3(0.86,0.93,1.0)*a, a);
      }`
  });
  const mesh = new THREE.Mesh(g, m); mesh.position.y = CEIL_Y/2; mesh.renderOrder = 5; scene.add(mesh);
  return mesh;
}

// ---------------------------------------------------------------- torso geometry
// 회전체(Lathe)로 몸통 단면을 만든 뒤, 어깨·가슴·등 근육을 정점 변형으로 조각합니다.
function makeTorsoGeometry(v){
  const P = [
    [0.00,0.00],[0.27,0.00],[0.33,0.06],[0.35,0.16],[0.34,0.30],[0.29,0.46],[0.26,0.58],
    [0.27,0.72],[0.31,0.88],[0.36,1.02],[0.39,1.14],[0.42,1.25],[0.43,1.33],[0.39,1.40],
    [0.25,1.445],[0.10,1.47],[0.092,1.53],[0.09,1.59],[0.05,1.62],[0.00,1.63]
  ].map(([r,y])=>new THREE.Vector2(r*(y<0.6? v.hip : 1), y));
  const curve = new THREE.SplineCurve(P);
  const g = new THREE.LatheGeometry(curve.getPoints(70), 96);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const ang = Math.atan2(z, x);
    const front = Math.max(0, -Math.sin(ang)); // -z 쪽이 정면이 되도록 아래서 회전
    const side = Math.abs(Math.cos(ang));
    // 어깨 폭과 흉곽
    x *= 1 + v.shoulder*gauss(y,1.30,0.16)*side + 0.12*gauss(y,1.08,0.2)*side;
    z *= 0.62;
    // 가슴 근육 / 복근 / 척추 홈
    const px = Math.abs(x) - 0.17;
    z -= front * v.chest * gauss(y,1.16,0.09) * gauss(px,0,0.12);
    z -= front * 0.015 * gauss(y,0.78,0.22) * (0.6+0.4*Math.cos(y*38)) * gauss(x,0,0.12);
    const back = Math.max(0, Math.sin(ang));
    z += back * 0.035 * gauss(x,0,0.035) * (y>0.3 && y<1.4 ? 1:0);
    z += back * 0.03 * gauss(y,1.18,0.12) * gauss(px+0.02,0,0.12); // 견갑골
    // 골반 앞 V라인
    z -= front * 0.02 * gauss(y,0.42,0.08) * gauss(Math.abs(x)-0.16,0,0.05);
    p.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  g.rotateY(Math.PI); // 정면을 +z로
  return g;
}

function linedTexture(){

  x.fillStyle='#f2f1ee'; x.fillRect(0,0,1024,1024);
  x.strokeStyle='rgba(60,62,70,0.75)'; x.lineWidth=3;
  for(let k=0;k<46;k++){ x.beginPath(); for(let yy=0; yy<=1024; yy+=8){ const xx = k*23 + Math.sin(yy*0.008 + k*0.6)*40 + Math.sin(yy*0.02+k)*10; yy?x.lineTo(xx,yy):x.moveTo(xx,yy);} x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=THREE.RepeatWrapping; t.anisotropy=8; return t;
}

  const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d');

  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=THREE.RepeatWrapping; return t;
}

// ---------------------------------------------------------------- camera director
const state = { mode:'intro', index:-1, tour:true, shotT:0, time:0 };
const cam = { a: Math.PI/2, r: 2.5, h: 16.5 };
const camTarget = new THREE.Vector3(0, 0, 0);
const want = { a:0, r:0, h:0, target:new THREE.Vector3() };
const mouse = new THREE.Vector2(0,0), mouseSmooth = new THREE.Vector2(0,0);

function setTourButton(){ const b=$('btnTour'); b.classList.toggle('on', state.tour); b.textContent = state.tour ? '자동 투어 ❚❚' : '자동 투어 ▶'; }
function focusOn(i, manual=false){
  i = (i + STUDENTS.length) % STUDENTS.length;
  if(manual){ state.tour = false; setTourButton(); }
  if(i !== state.index){
    state.index = i; state.shotT = 0;
    spotTurn ^= 1;
    spots.forEach((s,k)=>{ s.goal = k===spotTurn ? 1 : 0; });
    const sp = spots[spotTurn]; sp.index = i;
    const tp = posOf(i, PED_H + 0.75);
    const lp = posOf(i).multiplyScalar(0.42); lp.y = 8.5;
    sp.light.position.copy(lp); sp.light.target.position.copy(tp);
  }
  state.mode = 'focus';
  updateCard(i); $('card').classList.add('show');
}
function overview(){
  state.mode = 'overview'; state.index = -1; state.shotT = 0;
  spots.forEach(s=>s.goal=0);
  $('card').classList.remove('show');
  [...chipsEl.children].forEach(c=>c.classList.remove('active'));
}

function computeWanted(dt){
  const t = state.time;
  if(state.mode==='intro'){
    want.a = Math.PI/2 + t*0.03; want.r = 2.5; want.h = 16.5; want.target.set(0,0,0);
  } else if(state.mode==='overview'){
    // 발코니 높이에서 15점이 한 화면에 들어오도록 천천히 회전
    want.a = cam.a + dt*0.05; want.r = 10.6; want.h = 8.4; want.target.set(0, 0.2, 0);
  } else {
    const th = angleOf(state.index);
    // 작품 앞에서 좌→우로 천천히 호를 그리며 이동 (다음 작품 시작 각도와 이어지도록)
    const sway = -0.21*Math.cos(state.shotT*Math.PI/DWELL);
    want.a = th + sway; want.r = RING_R - 3.3; want.h = 1.65 + 0.25*Math.sin(state.shotT*0.35);
    want.target.copy(posOf(state.index, PED_H + 0.68));
    // 모바일에서는 하단 카드에 가리지 않도록 작품을 화면 위쪽에 둠
    if(innerWidth <= 760){ want.target.y -= 0.85; want.h += 0.3; }
    // 입장: 토르소를 향해 곧장 다가가며 빛 속으로 들어감
    if(state.mode==='door'){ want.a = th; want.r = RING_R - 0.9; want.h = PED_H + 0.75; want.target.y = PED_H + 0.75; }
  }
}

function updateCamera(dt){
  computeWanted(dt);
  const k = state.mode==='door' ? 1.6 : (state.mode==='focus' ? 0.9 : (state.mode==='overview' ? 0.55 : 2));
  cam.a += angDiff(cam.a, want.a) * (1-Math.exp(-k*dt));
  cam.r = damp(cam.r, want.r, k, dt);
  cam.h = damp(cam.h, want.h, k*0.85, dt);
  camTarget.x = damp(camTarget.x, want.target.x, k*1.3, dt);
  camTarget.y = damp(camTarget.y, want.target.y, k*1.3, dt);
  camTarget.z = damp(camTarget.z, want.target.z, k*1.3, dt);
  mouseSmooth.x = damp(mouseSmooth.x, mouse.x, 2, dt); mouseSmooth.y = damp(mouseSmooth.y, mouse.y, 2, dt);
  camera.position.set(Math.cos(cam.a)*cam.r, cam.h, Math.sin(cam.a)*cam.r);
  const look = camTarget.clone();
  // 마우스에 따라 시선이 살짝 따라가는 패럴랙스
  const right = new THREE.Vector3().subVectors(look, camera.position).cross(camera.up).normalize();
  look.addScaledVector(right, mouseSmooth.x*0.35).add(new THREE.Vector3(0, mouseSmooth.y*0.25, 0));
  camera.lookAt(look);
}

// ---------------------------------------------------------------- per-frame lighting
function updateLighting(dt){
  const focus = state.mode==='focus' || state.mode==='door';
  hemi.intensity = damp(hemi.intensity, focus ? 0.38 : 0.7, 1.2, dt);
  sun.intensity = damp(sun.intensity, focus ? 0.55 : 1.1, 1.2, dt);
  spots.forEach(s=>{ s.level = damp(s.level, s.goal, s.goal ? 1.1 : 1.6, dt); s.light.intensity = s.level*75; s.light.visible = s.level>0.01; });
  beamUniforms.uStrength.value = damp(beamUniforms.uStrength.value, focus ? 0.75 : 1.0, 1, dt);
  pieces.forEach((pc,i)=>{
    const goal = state.mode==='intro' ? 0.4 : (state.mode==='overview' ? 0.6 : (i===state.index ? 1 : 0.18));
    pc.lit = damp(pc.lit, Math.max(goal, pc.hover ? 0.85 : 0), 2, dt);
    pc.glow.material.opacity = pc.lit*0.8;
    pc.labelMat.opacity = 0.35 + pc.lit*0.6;
    pc.edgeMat.opacity = 0.15 + pc.lit*0.75;
    if(pc.torso.material.emissiveIntensity!==undefined && pc.torso.userData.baseE===undefined) pc.torso.userData.baseE = pc.torso.material.emissiveIntensity;
    pc.torso.material.emissiveIntensity = pc.torso.userData.baseE * (0.5 + pc.lit);
    // 비추는 작품은 아주 느리게 회전하며 표면의 빛을 보여 줌
    const spin = (i===state.index && focus) ? 0.06 : 0;
    pc.torso.rotation.y = damp(pc.torso.rotation.y, spin ? pc.torso.rotation.y + spin : 0, spin ? 4 : 0.4, dt);
  });
}

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
let hoverIdx = -1;
function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.index : -1;
}
renderer.domElement.addEventListener('pointermove', ev=>{
  mouse.set((ev.clientX/innerWidth)*2-1, -(ev.clientY/innerHeight)*2+1);
  if(state.mode==='intro') return;
  const i = pick(ev);
  if(i!==hoverIdx){ if(hoverIdx>=0) pieces[hoverIdx].hover=0; hoverIdx=i; if(i>=0) pieces[i].hover=1; }
  renderer.domElement.style.cursor = i>=0 ? 'pointer' : 'default';
  const tip=$('tip');
  if(i>=0 && i!==state.index){ tip.textContent = `${String(i+1).padStart(2,'0')} · ${STUDENTS[i].name} 「${STUDENTS[i].work}」`; tip.style.left=ev.clientX+'px'; tip.style.top=ev.clientY+'px'; tip.style.opacity=1; }
  else tip.style.opacity=0;
});
renderer.domElement.addEventListener('click', ev=>{
  if(state.mode==='intro') return;
  const i = pick(ev);
  if(i>=0){
    // 이미 비추고 있는 작품을 한 번 더 클릭하면 학생 작품 페이지로 이동
    if(i===state.index && STUDENTS[i].url) enterStudent(i);
    else focusOn(i, true);
  }
});

// 학생 전시실로 입장: 카메라가 토르소 쪽으로 다가가며 화면이 빛으로 하얗게 차오른 뒤 이동
function enterStudent(i){
  const s = STUDENTS[i];
  if(!s.url || state.mode==='door') return;
  if(state.index !== i) focusOn(i, true);
  state.tour = false; setTourButton();
  state.mode = 'door';
  $('card').classList.remove('show');
  ['top','strip'].forEach(id=>$(id).style.opacity=0);
  setTimeout(()=>$('fade').classList.add('on'), 250);
  // 이동하는 동안 다음 전시실 페이지를 미리 받아 둠
  const pre = document.createElement('link'); pre.rel = 'prefetch'; pre.href = s.url; document.head.appendChild(pre);
  // 전시실의 '졸업전시장' 버튼이 정확히 이 페이지로 돌아오도록 현재 주소를 함께 넘김
  const hall = location.href.split('#')[0].split('?')[0];
  setTimeout(()=>{ location.href = s.url + (s.url.includes('?') ? '&' : '?') + 'from=hall&seat=' + (i+1) + '&hall=' + encodeURIComponent(hall); }, 1400);
}
$('cGo').addEventListener('click', e=>{ e.preventDefault(); if(state.index>=0) enterStudent(state.index); });
// 뒤로 가기로 돌아왔을 때(bfcache) 화면이 하얗게 남지 않도록
addEventListener('pageshow', e=>{ if(e.persisted){ $('fade').classList.remove('on'); ['top','strip'].forEach(id=>$(id).style.opacity=1); if(state.mode==='door') focusOn(state.index); } });

$('btnOverview').onclick = ()=>overview();
$('btnTour').onclick = ()=>{ state.tour = !state.tour; setTourButton(); if(state.tour && state.mode!=='focus') focusOn(0); };
$('cPrev').onclick = ()=>focusOn(state.index-1, true);
$('cNext').onclick = ()=>focusOn(state.index+1, true);
addEventListener('keydown', e=>{
  if(state.mode==='intro') return;
  if(e.key==='ArrowRight') focusOn((state.index<0?-1:state.index)+1, true);
  else if(e.key==='ArrowLeft') focusOn((state.index<0?1:state.index)-1, true);
  else if(e.key==='Escape') overview();
  else if(e.key===' '){ e.preventDefault(); $('btnTour').click(); }
});

// ---------------------------------------------------------------- enter sequence
function enter(){
  $('intro').classList.add('hide');
  ['top','strip','hint'].forEach(id=>$(id).style.opacity=1);
  setTimeout(()=>{ $('hint').style.opacity=0; }, 9000);
  overview();
  // 내려오는 동안 전체를 보여 준 뒤 자동 투어 시작
  setTimeout(()=>{ if(state.tour && state.mode==='overview') focusOn(0); }, 7000);
}
$('enter').onclick = enter;

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;
  if(state.mode==='focus' || state.mode==='door'){
    state.shotT += dt;
    $('progBar').style.width = (state.tour ? Math.min(100, state.shotT/DWELL*100) : 0)+'%';
    if(state.mode==='focus' && state.tour && state.shotT >= DWELL){
      if(state.index === STUDENTS.length-1){ overview(); setTimeout(()=>{ if(state.tour && state.mode==='overview') focusOn(0); }, 9000); }
      else focusOn(state.index+1);
    }
  } else if(state.mode==='overview' && state.tour && state.index<0){ /* 투어 대기 */ }
  beamUniforms.uTime.value = state.time;
  // 먼지 입자 천천히 하강·흔들림
  const pa = dustGeo.attributes.position;
  for(let i=0;i<DUST;i++){
    let y = pa.getY(i) - dt*(0.08+dustSeed[i]*0.12); if(y<0) y += CEIL_Y;
    pa.setY(i, y);
    pa.setX(i, pa.getX(i) + Math.sin(state.time*0.4 + dustSeed[i]*30)*dt*0.03);
  }
  pa.needsUpdate = true;
  updateCamera(dt);
  updateLighting(dt);
  composer.render();
  requestAnimationFrame(tick);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// 폰트가 준비된 뒤 라벨을 그려야 글꼴이 맞게 나옵니다.
(document.fonts ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,2500))]) : Promise.resolve()).then(()=>{
  buildPieces();
  addVisitors();
  tick();
  const b = $('enter'); b.disabled = false; b.textContent = '입장하기';
  const q = new URLSearchParams(location.search);
  const back = parseInt(q.get('return'), 10);
  if(back >= 1 && back <= STUDENTS.length){
    // 학생 전시실에서 돌아온 경우: 입장 화면 없이 그 학생의 토르소 앞에서 시작
    $('intro').classList.add('hide'); ['top','strip'].forEach(id=>$(id).style.opacity=1);
    state.tour = false; setTourButton(); focusOn(back-1);
    computeWanted(0); cam.a = want.a; cam.r = RING_R - 1.2; cam.h = want.h; camTarget.copy(want.target);
  } else if(q.has('autostart')) enter();
  window.__vr = { state, cam, camTarget, focusOn, overview, enter, snap(){ computeWanted(0); cam.a=want.a; cam.r=want.r; cam.h=want.h; camTarget.copy(want.target); pieces.forEach(p=>p.lit=0.6); spots.forEach(s=>s.level=s.goal); } };
});
</script>
